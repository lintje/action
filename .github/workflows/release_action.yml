name: Release a new version of Lintje GitHub action, without updating Lintje

on:
  workflow_dispatch:
    inputs:
      version:
        description: Action release version to use, with or without the leading v. Use the current Lintje version with an incrementing suffix, e.g. v0.11.3-4
        required: true
        type: string
      notes:
        description: Release notes for the GitHub release. Defaults to a generic message
        required: false
        type: string

permissions:
  contents: write

env:
  PUBLISH_GIT_USERNAME: "Lintje release bot"
  PUBLISH_GIT_EMAIL: "lintje@tomdebruijn.com"

jobs:
  release_action:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v7
        with:
          ssh-key: "${{secrets.PUBLISH_DEPLOY_KEY}}"
          ref: main

      - name: Normalize version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Release version must use the format v<lintje-version>-N, e.g. v0.11.3-4. Use the 'Update Lintje action' workflow to release a new Lintje version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry
        run: |
          if ! grep -q "^## v${{ steps.version.outputs.version }}" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry found for v${{ steps.version.outputs.version }}. Add one and push it to main before running this workflow."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Build package
        run: |
          npm ci
          npm run build

      - name: "Configure Git"
        run: |
          export PUBLISH_GIT_SSH_PATH="$HOME/.ssh"
          export PUBLISH_GIT_SIGN_KEY_PATH="$HOME/.ssh/sign_key"
          mkdir -p "$PUBLISH_GIT_SSH_PATH"
          echo "${{secrets.PUBLISH_GIT_SIGN_KEY}}" > "$PUBLISH_GIT_SIGN_KEY_PATH"
          echo "${{secrets.PUBLISH_GIT_SIGN_PUBLIC_KEY}}" > "$PUBLISH_GIT_SIGN_KEY_PATH.pub"
          chmod 600 "$PUBLISH_GIT_SIGN_KEY_PATH"
          git config --global user.name "$PUBLISH_GIT_USERNAME (as ${{github.actor}})"
          git config --global user.email "$PUBLISH_GIT_EMAIL"
          git config --global gpg.format ssh
          git config --global commit.gpgsign true
          touch ~/.ssh/allowed_signers
          echo "$(git config --get user.email) namespaces=\"git\" $(cat $PUBLISH_GIT_SIGN_KEY_PATH.pub)" >> ~/.ssh/allowed_signers
          git config --global user.signingkey "$PUBLISH_GIT_SIGN_KEY_PATH"

      - name: Commit and push changes
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit \
              -m "Release v${{ steps.version.outputs.version }}" \
              -m "Release automated via GitHub Actions."
            git push origin "HEAD:main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Release v$VERSION."
          fi
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release_notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release_notes.md

      - name: "Add next steps to the workflow summary"
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          {
            echo "## Next step: publish the Action to the GitHub Marketplace"
            echo ""
            echo "Publish the v${RELEASE_VERSION} release to the GitHub Marketplace " \
              "by editing the release and selecting \"Publish this Action to the " \
              "GitHub Marketplace\". Publishing requires two-factor authentication."
            echo ""
            echo "https://github.com/lintje/action/releases/v${RELEASE_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
